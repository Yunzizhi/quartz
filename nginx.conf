server {
    listen 80;
    server_name your-domain.com;
    root /usr/share/nginx/html;
    index index.html;

    # Quartz 生成的是 file.html 格式，需要处理无扩展名 URL
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Webhook 端点，转发给内部服务
    location /rebuild {
        if ($request_method = POST) {
            proxy_pass http://127.0.0.1:3000;
            break;
        }
        try_files $uri $uri.html $uri/ =404;
    }
}
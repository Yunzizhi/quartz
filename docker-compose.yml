services:
  quartz:
    build: .
    container_name: quartz-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # 宿主机 8080 → 容器 8080
    command: npx quartz build --serve --port 8080 --host 0.0.0.0
    environment:
      REBUILD_WEBHOOK_SECRET: "你的随机密钥"
      BUILD_UPDATE_DELAY: 30
      AUTO_REBUILD: "true"